name: Despliegue prolipa front
on:
  push:
    branches: ["qa"]
  pull_request:
    branches: ["qa"]
jobs:
  build:
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{matrix.node-version}}
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node-version}}
      - run: npm install
      - run: npm run build
      - run: echo "${{ secrets.SUDO_PASSWORD_QA }}" | sudo -S cp -rf /media/svrfront1/Documentos/prolipa_front/actions-runner/plataformaprolipa_vue/plataformaprolipa_vue/dist /var/www/
